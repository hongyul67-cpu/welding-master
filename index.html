<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>용접 마스터</title>
<!-- 수업용 「모두 같은 문제」 — 다른 공용 스크립트보다 먼저 -->
<script src="https://hongyul67-cpu.github.io/links/fixorder.js"></script>
<style>
  :root{
    --bg:#f5f6f8; --card:#fff; --line:#e2e5ea; --tx:#1c2430; --dim:#6b7684;
    --pri:#2563eb; --ok:#12a150; --no:#e5484d; --warn:#f5a524;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--tx);
       font:15px/1.65 "Pretendard","맑은 고딕",system-ui,sans-serif}
  .wrap{max-width:860px;margin:0 auto;padding:16px 14px 90px}

  header{display:flex;align-items:center;gap:10px;margin:6px 0 14px;flex-wrap:wrap}
  header h1{font-size:20px;margin:0;font-weight:800}
  header .sub{color:var(--dim);font-size:13px}

  /* 탭 */
  .tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
  .tab{padding:9px 14px;border:1px solid var(--line);border-radius:999px;background:var(--card);
       cursor:pointer;font-weight:700;font-size:14px;color:var(--dim)}
  .tab.on{background:var(--pri);border-color:var(--pri);color:#fff}

  /* 수업 슬라이드 열기 — 화면을 바꾸는 탭이 아니라 별도 창을 여는 단추라 따로 둡니다 */
  .slidebtn{padding:9px 14px;border:1px solid #1f2937;border-radius:999px;background:#111827;
       cursor:pointer;font-weight:700;font-size:14px;color:#fff;margin-left:auto}

  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;
        padding:16px 18px;margin-bottom:12px}
  .card h3{margin:0 0 8px;font-size:16px}
  .card .body{color:#333}
  .kw{background:#eef4ff;color:#1d4ed8;border-radius:6px;padding:1px 6px;font-weight:700}

  .btn{border:1px solid var(--line);background:var(--card);border-radius:10px;
       padding:10px 16px;font-weight:700;cursor:pointer;font-size:14px}
  .btn-primary{background:var(--pri);border-color:var(--pri);color:#fff}
  .btn:disabled{opacity:.5;cursor:default}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

  /* 문제 */
  .qnum{color:var(--dim);font-size:13px;font-weight:700}
  .qtext{font-size:17px;font-weight:700;margin:6px 0 12px;line-height:1.5}
  .choice{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);
          border-radius:10px;padding:12px 14px;margin-bottom:8px;cursor:pointer;font-size:15px}
  .choice:hover{border-color:var(--pri)}
  .choice.correct{border-color:var(--ok);background:#eafaf1}
  .choice.wrong{border-color:var(--no);background:#fdeeee}
  .choice.picked{border-width:2px}
  .explain{background:#f8fafc;border-left:3px solid var(--pri);border-radius:0 8px 8px 0;
           padding:10px 14px;margin-top:10px;color:#334}
  .progress{height:8px;background:#e8ebf0;border-radius:99px;overflow:hidden;margin:10px 0 16px}
  .progress > i{display:block;height:100%;background:var(--pri);width:0;transition:width .25s}

  .empty{color:var(--dim);text-align:center;padding:34px 10px}
  .score{font-size:34px;font-weight:900;letter-spacing:-1px}
  .muted{color:var(--dim);font-size:13px}
  .pill{display:inline-block;background:#eef1f5;border-radius:99px;padding:2px 10px;
        font-size:12px;font-weight:700;color:var(--dim)}

  /* ── 이 도구에서 더한 것 ── */
  table.t{width:100%;border-collapse:collapse;font-size:14px;margin-top:8px;display:block;overflow-x:auto}
  table.t th,table.t td{border:1px solid var(--line);padding:7px 9px;text-align:left;white-space:nowrap}
  table.t th{background:#f2f5f9;font-weight:700}
  table.t td.c,table.t th.c{text-align:center}
  .fig{display:block;margin:10px auto;max-width:100%;height:auto}
  .figcap{text-align:center;color:var(--dim);font-size:12.5px;margin-top:-2px}
  ul.li{margin:6px 0 0;padding-left:20px}
  ul.li li{margin-bottom:3px}
  .warnbox{background:#fff8e8;border-left:3px solid var(--warn);border-radius:0 8px 8px 0;
           padding:9px 13px;margin-top:10px;font-size:14px}

  .gpick{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
  .gcard{border:1px solid var(--line);border-radius:12px;background:var(--card);padding:14px;
         cursor:pointer;text-align:left}
  .gcard:hover{border-color:var(--pri)}
  .gcard b{display:block;font-size:15px;margin-bottom:3px}
  .gcard span{color:var(--dim);font-size:13px}

  .slider{flex:1 1 180px;min-width:140px;margin:8px 0}
  .gauge{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--dim);flex-wrap:nowrap}
  .seq{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .chip{border:1px solid var(--line);background:var(--card);border-radius:999px;
        padding:8px 13px;font-weight:700;font-size:14px;cursor:pointer}
  .chip:hover{border-color:var(--pri)}
  .chip.used{opacity:.35;cursor:default}
  .chip.bad{border-color:var(--no);background:#fdeeee}
  .slot{display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-height:42px;
        border:1px dashed var(--line);border-radius:10px;padding:8px;background:#fbfcfe}
  .slot .chip{cursor:default}
  .combo{font-weight:800;color:var(--warn)}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>🔥 용접 마스터</h1>
    <span class="sub" id="hdSub"></span>
  </header>

  <div class="tabs">
    <button class="tab on" data-view="learn">📖 배우기</button>
    <button class="tab"    data-view="game">🎮 게임</button>
    <button class="tab"    data-view="practice">✏️ 연습 8문항</button>
    <button class="tab"    data-view="exam">🏁 종합시험 20문항</button>
    <button class="tab"    data-view="wrong">📕 오답노트</button>
    <button class="slidebtn" type="button" id="slideBtn">📽️ 수업 슬라이드 열기</button>
  </div>

  <div id="view"></div>
</div>

<script>
/* ══════════════════════════════════════════════════════════════
   용접 마스터
   규약: https://github.com/hongyul67-cpu/links/blob/master/CONVENTIONS.md

   내용 출처 (실제로 열어 확인한 것만 씀)
     · 기계기초공작 Ⅵ. 용접 작업 (01 용접원리 / 02 전기용접 / 03 가스용접)
       — 2017학년도 교과진도표의 단원 구성을 그대로 따름
     · 수업용 「용접 원리」·「가스 용접」 강의자료
     · 한국산업인력공단 훈련교재 『용접일반』(전 11장) · 『가스용접실기』
       · 『피복아크용접 실기』 · 『특수용접』
   문항은 전부 자작입니다. 학교 고사 원안은 저작권 표시가 있어 옮기지 않았습니다.
   ══════════════════════════════════════════════════════════════ */

/* ────────────────────────────────────────────────
   그림 — 외부 이미지는 깨지므로 SVG 를 직접 그립니다
   ──────────────────────────────────────────────── */

/* 용접될 때 일어나는 현상: 용적·용융지·용입·용착 */

  <path d="M120 105 q40 -22 80 0" fill="#ffd7a8" stroke="#c07a34"/>
  <rect x="152" y="8" width="12" height="62" fill="#7d8794"/>

  <circle cx="158" cy="84" r="9" fill="#ff9f43" stroke="#c07a34"/>

</svg>
<div class="figcap">용접부 단면 — 용적 · 용융지 · 용입 · 용착</div>`; }

/* 아크 용접 회로 */
function figCircuit(){ return `
<svg class="fig" viewBox="0 0 340 180" width="340" role="img" aria-label="아크 용접 회로 그림">
  <rect x="12" y="52" width="76" height="62" rx="6" fill="#eef1f5" stroke="#8b95a4"/>

  <text x="50" y="97" font-size="11" text-anchor="middle" fill="#6b7684">(전원)</text>
  <path d="M88 66 H150" stroke="#e5484d" stroke-width="3" fill="none"/>

  <path d="M230 70 l10 16 -6 0 8 14" stroke="#f5a524" stroke-width="3" fill="none"/>

  <rect x="150" y="112" width="176" height="20" fill="#c9d1dc" stroke="#8b95a4"/>
  <text x="238" y="126" font-size="12" text-anchor="middle" fill="#1c2430">모재</text>

  <text x="100" y="146" font-size="11" text-anchor="middle" fill="#2563eb">접지 케이블</text>
</svg>
<div class="figcap">전류가 한 바퀴 돌아 제자리로 오는 닫힌 회로입니다</div>`; }

/* 용접 자세 — 게임에서도 그대로 씁니다 (그림이 답을 흘리지 않게 기호는 넣지 않음) */
function figPos(k){
  const P='#c9d1dc', PL='#8b95a4', B='#e5484d', T='#2563eb';
  const torch = (x1,y1,x2,y2,hx,hy,dir)=>{
    const head = dir==='down' ? `${hx-6},${hy-9} ${hx+6},${hy-9} ${hx},${hy}`
              : dir==='up'   ? `${hx-6},${hy+9} ${hx+6},${hy+9} ${hx},${hy}`
              :                `${hx+9},${hy-6} ${hx+9},${hy+6} ${hx},${hy}`;
    return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${T}" stroke-width="7"
            stroke-linecap="round"/><polygon points="${head}" fill="${T}"/>`;
  };
  let inner='', note='';
  if(k==='F'){
    inner = `<rect x="24" y="96" width="172" height="22" fill="${P}" stroke="${PL}"/>
             <line x1="46" y1="96" x2="174" y2="96" stroke="${B}" stroke-width="7" stroke-linecap="round"/>
             ${torch(110,26,110,78,110,88,'down')}`;
    note='모재 : 수평면';
  } else if(k==='O'){
    inner = `<rect x="24" y="42" width="172" height="22" fill="${P}" stroke="${PL}"/>
             <line x1="46" y1="64" x2="174" y2="64" stroke="${B}" stroke-width="7" stroke-linecap="round"/>
             ${torch(110,134,110,82,110,72,'up')}`;
    note='모재 : 수평면';
  } else if(k==='H'){
    inner = `<rect x="30" y="18" width="128" height="124" fill="${P}" stroke="${PL}"/>
             <line x1="42" y1="80" x2="146" y2="80" stroke="${B}" stroke-width="7" stroke-linecap="round"/>
             ${torch(196,80,172,80,162,80,'left')}`;
    note='모재 : 수직면';
  } else {
    inner = `<rect x="30" y="18" width="128" height="124" fill="${P}" stroke="${PL}"/>
             <line x1="94" y1="30" x2="94" y2="130" stroke="${B}" stroke-width="7" stroke-linecap="round"/>
             ${torch(196,80,172,80,162,80,'left')}`;
    note='모재 : 수직면';
  }
  return `<svg class="fig" viewBox="0 0 220 160" width="220" role="img" aria-label="용접 자세 그림">
    ${inner}
    <text x="8" y="154" font-size="11" fill="#6b7684">${note}</text>
    <text x="196" y="154" font-size="11" fill="#6b7684" text-anchor="end">↓ 중력</text>
    <text x="8" y="14" font-size="11" fill="#e5484d">━ 용접선</text>
  </svg>`;
}

/* 가스 불꽃 — 배우기와 「불꽃 조절」 게임이 같은 함수를 씁니다 */
function figFlame(kind, w){
  w = w || 330;
  const cfg = {
    carb : { core:34, feather:1, inner:74, outer:150, oc:'#9aa7d8' },
    neut : { core:26, feather:0, inner:58, outer:112, oc:'#7f93e0' },
    oxid : { core:15, feather:0, inner:34, outer:74,  oc:'#6f8cf0' },
  }[kind];
  const x0 = 62, cy = 62;
  const feather = cfg.feather ? `
    <path d="M${x0} ${cy-17} Q${x0+cfg.inner*0.7} ${cy-24} ${x0+cfg.inner+16} ${cy}
             Q${x0+cfg.inner*0.7} ${cy+24} ${x0} ${cy+17} Z"
          fill="#fff4d6" stroke="#e8d49a"/>` : '';
  return `
<svg class="fig" viewBox="0 0 400 128" width="${w}" role="img" aria-label="가스 용접 불꽃 그림">
  <rect x="6" y="${cy-9}" width="46" height="18" rx="3" fill="#7d8794"/>
  <rect x="44" y="${cy-6}" width="18" height="12" rx="2" fill="#4a5560"/>
  <path d="M${x0} ${cy-30} Q${x0+cfg.outer*0.55} ${cy-40} ${x0+cfg.outer} ${cy}
           Q${x0+cfg.outer*0.55} ${cy+40} ${x0} ${cy+30} Z"
        fill="${cfg.oc}" opacity=".45"/>
  ${feather}
  <path d="M${x0} ${cy-19} Q${x0+cfg.inner*0.6} ${cy-25} ${x0+cfg.inner} ${cy}
           Q${x0+cfg.inner*0.6} ${cy+25} ${x0} ${cy+19} Z"
        fill="#4f74d8" opacity=".75"/>
  <path d="M${x0} ${cy-11} Q${x0+cfg.core*0.6} ${cy-14} ${x0+cfg.core} ${cy}
           Q${x0+cfg.core*0.6} ${cy+14} ${x0} ${cy+11} Z"
        fill="#ffffff" stroke="#dfe6f2"/>
  <text x="30" y="${cy+30}" font-size="11" fill="#6b7684">팁</text>
</svg>`; }

/* 산소·아세틸렌 용기 */
function figCylinders(){ return `

/* ── 1) 배우기 — 정답을 다 보여 주는 단계. 테스트보다 반드시 앞에 ── */
const LEARN = [

/* ═══ 1단원 용접 원리 ═══ */
{ unit:'1단원 용접 원리', t:'용접이란 무엇인가', body:
  '두 개 이상의 금속 재료를 <span class="kw">용융</span> 또는 <span class="kw">반용융</span> 상태에서 ' +
  '<span class="kw">용가재(용접봉)</span>를 첨가하여 접합하거나, 접합하고자 하는 부분을 적당한 온도로 ' +

  '<div class="explain">쇠를 <b>녹여서 붙인다</b>는 것이 핵심입니다. 볼트로 죄거나(체결) ' +
  '리벳으로 박는 것과 달리, 붙인 자리가 원래 한 덩어리였던 것처럼 이어집니다.</div>' },

{ unit:'1단원 용접 원리', t:'용접의 장점', body:
  '<ul class="li">' +
  '<li>재료의 <span class="kw">두께에 제한이 없다</span></li>' +
  '<li><span class="kw">기밀·수밀·유밀성</span>이 우수하며 이음 효율이 높다</li>' +
  '<li>작업 공정이 단축되어 재료가 절약되고 경제적이다</li>' +
  '<li>제품의 성능과 수명이 향상되며 <span class="kw">이종 재료</span>도 접합할 수 있다</li>' +
  '<li>보수와 수리가 용이하다</li>' +
  '<li>용접 준비 및 작업이 비교적 간단하고 자동화가 용이하다</li>' +
  '<li>소음이 적어 실내 작업이 가능하며 복잡한 구조물 제작이 쉽다</li></ul>' },

{ unit:'1단원 용접 원리', t:'용접의 단점', body:
  '<ul class="li">' +
  '<li><span class="kw">저온 취성</span>이 생길 우려가 있다</li>' +
  '<li>품질 검사가 곤란하고 <span class="kw">변형과 수축</span>이 생긴다</li>' +
  '<li>재질의 변형 및 <span class="kw">잔류 응력</span>이 발생한다</li>' +
  '<li>작업자의 기술에 따라 용접부의 품질이 좌우된다</li></ul>' +
  '<div class="explain">장점과 단점을 한 쌍으로 외우면 헷갈리지 않습니다. ' +
  '「재료가 절약된다」는 장점, 「변형과 수축이 생긴다」는 단점입니다.</div>' },

{ unit:'1단원 용접 원리', t:'용접될 때 일어나는 일 — 용적·용융지·용입·용착', body:
  figWeldTerms() +
  '<table class="t"><tr><th>용어</th><th>뜻</th></tr>' +
  '<tr><td>용적</td><td>용접봉이 녹아 모재로 옮겨 가는 쇳물 <b>방울</b></td></tr>' +
  '<tr><td>용융지</td><td>아크열로 모재가 녹아 쇳물이 <b>고인 곳</b></td></tr>' +
  '<tr><td>용입</td><td>아크열에 의하여 모재가 <b>녹아 들어간 깊이</b></td></tr>' +
  '<tr><td>용착</td><td>녹은 금속이 굳어 <b>모재에 붙은 것</b></td></tr>' +
  '<tr><td>비드</td><td>용착으로 생긴 <b>줄 모양의 자국</b></td></tr></table>' +
  '<div class="explain">네 낱말이 헷갈리는 이유는 모두 「녹는 것」을 가리키기 때문입니다. ' +
  '<b>방울(용적) → 웅덩이(용융지) → 깊이(용입) → 붙음(용착)</b> 순서로 기억하세요.</div>' },

/* ═══ 2단원 전기용접 ═══ */
{ unit:'2단원 전기용접', t:'아크 용접의 회로', body:
  '용접봉 끝과 모재 사이에 <span class="kw">아크</span>를 일으켜, 그 열(약 5,000℃ 이상)로 ' +
  '모재와 용접봉을 함께 녹여 붙이는 방법입니다. 전류는 아래처럼 <b>한 바퀴 돌아 제자리로</b> 옵니다.' +
  figCircuit() +
  '<div class="explain">용접기 → 홀더 케이블 → 홀더 → 용접봉 → 아크 → 모재 → 접지 케이블 → 용접기<br>' +
  '<b>케이블이 먼저, 홀더가 나중</b>입니다. 케이블이 홀더까지 전기를 날라다 주기 때문입니다.</div>' },

{ unit:'2단원 전기용접', t:'용접기에 딸린 기구', body:
  '<table class="t"><tr><th>기구</th><th>하는 일</th></tr>' +
  '<tr><td>홀더</td><td>용접봉을 물어 잡고 전류를 보낸다</td></tr>' +
  '<tr><td>홀더 케이블</td><td>용접기와 홀더를 잇는 2차 케이블</td></tr>' +
  '<tr><td>접지 클램프</td><td>모재에 물려 전류가 용접기로 돌아가게 한다</td></tr>' +
  '<tr><td>헬멧 · 핸드 실드</td><td>아크 광선·스패터로부터 눈과 얼굴을 보호</td></tr>' +
  '<tr><td>차광 유리</td><td>자외선·적외선을 막는다. 번호가 클수록 많이 막는다</td></tr>' +
  '<tr><td>치핑 해머</td><td>굳은 슬래그를 두들겨 떼어 낸다</td></tr>' +
  '<tr><td>와이어 브러시</td><td>비드 표면의 스케일·슬래그를 솔질해 없앤다</td></tr></table>' +
  '<div class="warnbox">접지 클램프를 헐겁게 물리면 아크가 불안정해지고 열이 나 위험합니다.</div>' },

{ unit:'2단원 전기용접', t:'극성 — 정극성과 역극성', body:
  '직류 용접기는 어느 쪽을 (+)에 잇느냐에 따라 성질이 달라집니다.' +
  '<table class="t"><tr><th></th><th class="c">직류 정극성</th><th class="c">직류 역극성</th></tr>' +
  '<tr><td>모재</td><td class="c">(+)</td><td class="c">(−)</td></tr>' +
  '<tr><td>용접봉</td><td class="c">(−)</td><td class="c">(+)</td></tr>' +
  '<tr><td>열이 많이 나는 쪽</td><td class="c">모재</td><td class="c">용접봉</td></tr>' +
  '<tr><td>용입 깊이</td><td class="c">깊다</td><td class="c">얕다</td></tr>' +
  '<tr><td>알맞은 곳</td><td class="c">두꺼운 판</td><td class="c">얇은 판</td></tr></table>' +
  '<div class="explain"><b>정</b>극성은 모재가 <b>(+)</b> — 「정」과 「+」를 짝지어 외우면 나머지는 반대로 따라옵니다. ' +
  '모재 쪽에 열이 몰리니 깊이 파이고(용입 깊음), 그래서 두꺼운 판에 씁니다.</div>' },

{ unit:'2단원 전기용접', t:'용접봉의 기호 읽기 — E 43 △△', body:
  '연강용 피복 아크 용접봉은 <span class="kw">KS D 7004</span> 에 규정되어 있습니다.' +
  '<table class="t"><tr><th class="c">E</th><th class="c">43</th><th class="c">△△</th></tr>' +
  '<tr><td class="c">피복 아크 용접봉</td><td class="c">용착 금속의<br>최소 인장 강도</td>' +
  '<td class="c">피복제의 계통</td></tr></table>' +
  '<div class="explain">43 은 <b>43kgf/mm²</b> 수준을 뜻합니다. 같은 봉을 미국에서는 ' +
  '야드·파운드법을 써서 60,000 lbs/in² → <b>E60△△</b> 로 적습니다. 숫자만 다르고 같은 봉입니다.</div>' },

{ unit:'2단원 전기용접', t:'연강용 피복 아크 용접봉의 종류 (KS D 7004)', body:
  '<table class="t"><tr><th>종류</th><th>피복제 계통</th><th>용접 자세</th></tr>' +
  '<tr><td>E 4301</td><td>일미나이트계</td><td>F, V, O, H</td></tr>' +
  '<tr><td>E 4303</td><td>라임티타니아계</td><td>F, V, O, H</td></tr>' +
  '<tr><td>E 4311</td><td>고셀룰로오스계</td><td>F, V, O, H</td></tr>' +
  '<tr><td>E 4313</td><td>고산화티탄계</td><td>F, V, O, H</td></tr>' +
  '<tr><td>E 4316</td><td>저수소계</td><td>F, V, O, H</td></tr>' +
  '<tr><td>E 4324</td><td>철분산화티탄계</td><td>F, H</td></tr>' +
  '<tr><td>E 4326</td><td>철분저수소계</td><td>F, H</td></tr>' +
  '<tr><td>E 4327</td><td>철분산화철계</td><td>F, H</td></tr>' +
  '<tr><td>E 4340</td><td>특수계</td><td>F, V, O, H 또는 어느 자세</td></tr></table>' +
  '<div class="explain">「<b>철분</b>」이 붙은 세 가지(4324·4326·4327)는 <b>F, H 두 자세뿐</b>입니다. ' +
  '철분이 들어가 무거워서 위보기·수직에서는 쇳물이 흘러내리기 때문입니다.</div>' },

{ unit:'2단원 전기용접', t:'피복제는 왜 바르는가', body:
  '심선에 발라 놓은 피복제는 아크열에 타면서 여러 일을 한꺼번에 합니다.' +
  '<table class="t"><tr><th>성분</th><th>하는 일</th><th>보기</th></tr>' +
  '<tr><td>아크 안정제</td><td>이온화하여 아크를 안정시킨다</td><td>산화티탄, 규산나트륨, 석회석</td></tr>' +
  '<tr><td>가스 발생제</td><td>가스를 내어 용융 금속을 공기로부터 지킨다</td><td>녹말, 톱밥, 셀룰로오스</td></tr>' +
  '<tr><td>슬래그 생성제</td><td>슬래그를 덮어 <b>급랭을 막는다</b></td><td>—</td></tr>' +
  '<tr><td>탈산제</td><td>산소를 빼앗아 정련한다</td><td>—</td></tr>' +
  '<tr><td>고착제</td><td>피복 배합제를 심선에 붙여 둔다</td><td>—</td></tr>' +
  '<tr><td>합금제</td><td>용접 금속의 성질을 좋게 한다</td><td>Mn, Si, Ni, Mo, Cr, Cu</td></tr></table>' +
  '<div class="warnbox">슬래그는 <b>천천히 식게 덮어 주는 이불</b>입니다. ' +
  '「슬래그가 급랭시킨다」는 설명은 정반대라 틀린 말입니다.</div>' },

{ unit:'2단원 전기용접', t:'용접 자세 네 가지', body:
  '<div class="row" style="justify-content:center;gap:0">' + figPos('F') + figPos('H') + '</div>' +
  '<div class="figcap">왼쪽 : 아래보기(F) &nbsp;·&nbsp; 오른쪽 : 수평(H)</div>' +
  '<div class="row" style="justify-content:center;gap:0">' + figPos('V') + figPos('O') + '</div>' +
  '<div class="figcap">왼쪽 : 수직(V) &nbsp;·&nbsp; 오른쪽 : 위보기(O)</div>' +
  '<table class="t"><tr><th class="c">기호</th><th>이름</th><th>어떤 자세인가</th></tr>' +
  '<tr><td class="c">F</td><td>아래보기</td><td>모재가 수평이고 위에서 내려다보며 한다 (flat)</td></tr>' +
  '<tr><td class="c">H</td><td>수평</td><td>수직면에서 용접선이 <b>옆으로</b> 간다 (horizontal)</td></tr>' +
  '<tr><td class="c">V</td><td>수직</td><td>수직면에서 용접선이 <b>위아래로</b> 간다 (vertical)</td></tr>' +
  '<tr><td class="c">O</td><td>위보기</td><td>모재 <b>아래</b>에서 올려다보며 한다 (overhead)</td></tr></table>' +
  '<div class="explain">F 가 가장 쉽고 O 가 가장 어렵습니다. 쇳물이 중력을 거슬러야 하기 때문입니다. ' +
  '그래서 실습은 언제나 아래보기부터 시작합니다.</div>' },

{ unit:'2단원 전기용접', t:'아크 쏠림(자기 불림)', body:
  '용접봉에 아크가 <b>한쪽으로 쏠리는</b> 현상입니다. 전류가 만드는 자기장이 용접부에 대해 ' +
  '비대칭으로 생겨서 일어나며, <span class="kw">자기 불림</span>이라고도 합니다. ' +
  '전류 방향이 계속 바뀌는 <b>교류에서는 생기지 않습니다.</b>' +
  '<ul class="li"><li>직류 대신 <b>교류</b>로 용접한다</li>' +
  '<li>큰 가접부나 이미 끝난 용착부를 향하여 용접한다</li>' +
  '<li>용접부가 길면 후퇴 용접법으로 한다</li>' +
  '<li>접지점을 될 수 있는 대로 용접부에서 <b>멀리</b> 한다</li>' +
  '<li><b>짧은 아크</b>를 쓴다</li>' +
  '<li>용접봉 끝을 쏠리는 반대 방향으로 기울인다</li>' +
  '<li>받침쇠·긴 가접부·엔드 탭을 이용한다</li>' +
  '<li>접지점 두 개를 연결한다</li></ul>' },

{ unit:'2단원 전기용접', t:'용접 결함 — 눈으로 찾는 것들', body:
  '<table class="t"><tr><th>결함</th><th>어떤 모습인가</th></tr>' +
  '<tr><td>언더컷</td><td>비드 가장자리의 모재가 <b>파여 홈</b>이 생긴 것</td></tr>' +
  '<tr><td>오버랩</td><td>녹은 금속이 모재에 붙지 못하고 <b>덮어씌워진</b> 것</td></tr>' +
  '<tr><td>용입 불량</td><td>충분히 파고들지 못해 속이 <b>붙지 않은</b> 것</td></tr>' +
  '<tr><td>크레이터</td><td>아크를 끊은 자리가 <b>오목하게 파인</b> 것</td></tr>' +
  '<tr><td>스패터</td><td>사방으로 튄 <b>쇳물 알갱이</b></td></tr></table>' +
  '<div class="explain"><b>크레이터 처리</b> — 아크를 중단한 자리에는 불순물과 편석이 남고 냉각 중에 ' +
  '균열이 생길 수 있습니다. 그래서 비드 끝에서 아크를 끊었다가 짧게 다시 일으키기를 ' +
  '두세 번 반복해 오목한 곳을 <b>메워 줍니다</b>.</div>' },

/* ═══ 3단원 가스용접 ═══ */
{ unit:'3단원 가스용접', t:'산소와 아세틸렌', body:
  figCylinders() +
  '<table class="t"><tr><th></th><th class="c">산소</th><th class="c">아세틸렌</th></tr>' +
  '<tr><td>성질</td><td class="c">조연성 가스<br>(스스로 타지 않고 타는 것을 돕는다)</td>' +
  '<td class="c">가연성 가스<br>(스스로 잘 탄다)</td></tr>' +
  '<tr><td>충전 압력</td><td class="c">150 kgf/cm²</td><td class="c">15.5 kgf/cm²</td></tr>' +
  '<tr><td>용기 색</td><td class="c">녹색</td><td class="c">노란색</td></tr>' +
  '<tr><td>호스 색</td><td class="c">녹색</td><td class="c">빨간색</td></tr>' +
  '<tr><td>공기와 견주면</td><td class="c">무겁다</td><td class="c">가볍다</td></tr></table>' +
  '<div class="explain">아세틸렌은 원래 <b>무색무취</b>라 새어도 알 수 없습니다. ' +
  '그래서 <b>양파 썩는 냄새</b>를 일부러 넣어 둡니다. 이 냄새가 나면 곧바로 밸브를 잠급니다.</div>' },

{ unit:'3단원 가스용접', t:'가스 용접 장치', body:
  '<table class="t"><tr><th>부품</th><th>하는 일</th></tr>' +
  '<tr><td>압력 조정기</td><td>용기의 높은 압력을 작업에 쓸 압력으로 <b>낮춰 준다</b></td></tr>' +
  '<tr><td>토치</td><td>산소와 아세틸렌을 <b>섞어</b> 내보낸다</td></tr>' +
  '<tr><td>팁</td><td>토치 끝에 끼우는 노즐. 모재 두께에 맞춰 번호를 고른다</td></tr>' +
  '<tr><td>호스</td><td>산소는 녹색, 아세틸렌은 빨간색</td></tr>' +
  '<tr><td>안전기</td><td>불꽃이 거꾸로 타 들어오는 것을 막는다</td></tr></table>' +
  '<div class="explain">사용 압력의 보기 — 산소 2~5kgf/cm², 아세틸렌 0.2~0.5kgf/cm² 정도로 맞춥니다. ' +
  '아세틸렌 쪽이 훨씬 낮다는 점을 기억하세요.</div>' },

{ unit:'3단원 가스용접', t:'불꽃의 구성', body:
  figFlameLabel() +
  '<table class="t"><tr><th>부분</th><th>성질</th></tr>' +
  '<tr><td>불꽃심(백심)</td><td>가장 밝고 흰 부분</td></tr>' +
  '<tr><td>속불꽃</td><td>온도가 가장 높으며 <b>환원성</b>을 띤다</td></tr>' +
  '<tr><td>겉불꽃</td><td>온도가 비교적 낮으며 금속을 <b>산화</b>시킨다</td></tr></table>' +
  '<div class="explain">그래서 용접은 <b>백심 끝에서 2~3㎜ 앞</b>, 즉 속불꽃 자리에서 합니다. ' +
  '백심이 쇳물에 닿으면 금속에 화학적 영향을 주므로 닿지 않게 합니다.</div>' },

{ unit:'3단원 가스용접', t:'불꽃의 종류 — 산소를 얼마나 주느냐', body:

/* ── 수업 슬라이드 (교실 화면용) ──────────────────────
   원고는 lesson.js, 화면은 links/board-pro.js(공용 뷰어)가 담당한다.
   board-pro.js 는 공용이라 이 저장소로 복사하지 않고 고치지도 않는다.
   배우기 카드는 그대로 있다 — 이것은 별도의 한 벌이다. */
function openSlides(){
  const ALL = window.LESSON || [], FIG = window.FIGS || {};
  if(!ALL.length || typeof BoardPro === 'undefined'){
    alert('수업 슬라이드를 불러오지 못했습니다. 인터넷 연결을 확인해 주세요.');
    return;
  }
  const units = [];
  ALL.forEach((s,i)=>{
    let g = units.find(x=>x.name===s.u);
    if(!g){ g={name:s.u, idx:[]}; units.push(g); }
    g.idx.push(i);
  });
  const MENU = units.map(U=>({
    icon:'📘', title:U.name, desc:'슬라이드 '+U.idx.length+'장',
    run:{ kind:'lesson', deck:U.idx.map(i=>ALL[i]) }
  }));
  MENU.push({icon:'📚', wide:true, title:'전체 이어서 ('+ALL.length+'장)',
             desc:'1단원부터 끝까지', run:{kind:'lesson', deck:ALL}});
  MENU.push({icon:'⬜', wide:true, title:'빈 칠판',
             desc:'슬라이드 없이 판서만', run:{kind:'blank'}});

  BoardPro.open({
    title:'📽️ 용접 · 수업 슬라이드',
    sub:'요점 → <b>발문</b> → 퀴즈 → 정답을 하나씩 엽니다. 화면 어디든 바로 판서됩니다.<br>'+
        '요점 속 <b>파란 빈칸</b>은 눌러야 답이 보입니다.',
    menu: MENU,
    fig: s => (s.fig && FIG[s.fig]) ? FIG[s.fig]() : ''
  });
}

function render(view){
  const v = $('#view');
  v.innerHTML = '';
  window.scrollTo(0,0);
  if(view==='learn')    return renderLearn(v);
  if(view==='game')     return renderGamePick(v);
  if(view==='practice') return startQuiz(v,'practice');
  if(view==='exam')     return startQuiz(v,'exam');
  if(view==='wrong')    return renderWrong(v);
}

function renderLearn(v){
  let unit = '';
  LEARN.forEach(c=>{
    if(c.unit !== unit){
      unit = c.unit;
      v.appendChild(el(`<h2 style="font-size:17px;margin:20px 0 8px">${esc(unit)}</h2>`));

    v.appendChild(el(`<div class="card">
      <span class="pill">${esc(c.unit||'')}</span>
      <h3>${esc(c.t)}</h3>
      <div class="body">${c.body}</div>
    </div>`));

  v.appendChild(el(`<div class="card row">
    <b>다 읽었으면</b>
    <button class="btn btn-primary" id="goGame">🎮 게임으로 익히기</button>

}

function gameFinish(v, title, correct, total, sec, wrongList){
  const pct = Math.round(correct/total*100);
  v.innerHTML = '';
  v.appendChild(el(`<div class="card" style="text-align:center">
    <div class="pill">${esc(title)}</div>
    <div class="score" style="margin-top:6px">${pct}점</div>
    <div class="muted">${total}판 중 ${correct}판 성공 · ${Math.floor(sec/60)}분 ${sec%60}초</div>
    <div id="rankBox" style="margin-top:12px"></div>
    <div id="rSubmitAnchor" style="margin-top:12px"></div>
  </div>`));
  if(wrongList && wrongList.length){
    v.appendChild(el(`<div class="card"><h3>📕 놓친 것</h3>
      <ul class="li">${wrongList.map(w=>`<li>${esc(w)}</li>`).join('')}</ul></div>`));
  }
  mountSubmit(pct, correct, total, sec, title, (wrongList||[]).map(w=>({txt:w})));
  try{
    if(window.FX && pct>=60){
      FX.banner({ title: pct>=90?'훌륭합니다!':'통과!', sub:`${title} ${pct}점`,
                  stars: FX.starsFor ? FX.starsFor(pct) : 0 });
    }
  }catch(e){ console.warn('FX', e); }
  try{
    if(window.Rank){
      const res = Rank.award(pct, { mode:`용접 마스터 — ${title}` });
      $('#rankBox').innerHTML = Rank.resultBox(res);
    }
  }catch(e){ console.warn('Rank', e); }
  v.appendChild(gameBackBtn(v));
}

/* ── 게임 1 · 불꽃 조절 ── */
function bandOf(o){ return o < 38 ? 'carb' : (o <= 62 ? 'neut' : 'oxid'); }

function gameFlame(v){
  const rounds = shuffle([...FLAMES, ...FLAMES]).slice(0,5);
  let i=0, correct=0, combo=0, wrong=[], t0=Date.now();

  function step(){
    if(i>=rounds.length) return gameFinish(v,'불꽃 조절',correct,rounds.length,
                                           Math.round((Date.now()-t0)/1000), wrong);
    const target = rounds[i];
    v.innerHTML='';
    v.appendChild(el(`<div class="progress"><i style="width:${i/rounds.length*100}%"></i></div>`));
    const card = el(`<div class="card">
      <div class="qnum">${i+1} / ${rounds.length}
        <span class="pill" style="margin-left:6px">${correct}판 성공</span>
        <span class="combo" id="cmb"></span></div>
      <div class="qtext">🔥 <b>${esc(target.name)}</b> 만들기</div>
      <div class="muted">아세틸렌은 이미 열려 있습니다. <b>산소 밸브</b>만 돌려 맞추세요.</div>
      <div id="flameBox" style="text-align:center"></div>
      <div class="gauge"><span>아세틸렌 ◀</span>
        <input class="slider" type="range" min="0" max="100" value="20" id="oxy">
        <span>▶ 산소</span></div>
      <div class="row"><button class="btn btn-primary" id="fire">이 불꽃으로 확정</button>
        <span class="muted" id="oxlab"></span></div>
      <div id="fex"></div>
    </div>`);
    v.appendChild(card);
    v.appendChild(gameBackBtn(v));

    const sl = card.querySelector('#oxy');
    const box = card.querySelector('#flameBox');
    const lab = card.querySelector('#oxlab');
    const cmb = card.querySelector('#cmb');
    if(combo>=2) cmb.textContent = ` 🔥 ${combo}연속`;

    const draw = ()=>{ box.innerHTML = figFlame(bandOf(+sl.value), 320);
                       lab.textContent = `산소 밸브 ${sl.value}`; };
    sl.oninput = draw; draw();

    card.querySelector('#fire').onclick = (e)=>{
      const got = bandOf(+sl.value);
      const ok = got === target.k;
      sl.disabled = true;
      e.target.disabled = true;
      if(ok){ correct++; combo++; } else {
        combo = 0;
        wrong.push(`${target.name} → ${FLAMES.find(f=>f.k===got).name} 을 만듦`);
      }
      try{ if(window.FX) ok ? FX.ok(e.target) : FX.no(e.target); }catch(err){ console.warn('FX',err); }
      const ex = card.querySelector('#fex');
      ex.appendChild(el(`<div class="explain"><b>${ok?'맞았습니다':'만들어진 것은 '+FLAMES.find(f=>f.k===got).name}</b><br>
        산소를 조금씩 더 열면 탄화 → 중성 → 산화 순으로 바뀌고 불꽃은 점점 짧고 뾰족해집니다.</div>`));
      const nx = el(`<div class="row" style="margin-top:10px">
        <button class="btn btn-primary">${i+1>=rounds.length?'결과 보기':'다음 →'}</button></div>`);
      ex.appendChild(nx);
      nx.querySelector('button').onclick = ()=>{ i++; step(); };
    };
  }
  step();
}

/* ── 게임 2 · 자세 맞히기 ── */
function gamePos(v){
  const rounds = shuffle([...POS_LIST,...POS_LIST]).slice(0,8);
  let i=0, correct=0, combo=0, wrong=[], t0=Date.now();

  function step(){
    if(i>=rounds.length) return gameFinish(v,'자세 맞히기',correct,rounds.length,
                                           Math.round((Date.now()-t0)/1000), wrong);
    const t = rounds[i];
    v.innerHTML='';
    v.appendChild(el(`<div class="progress"><i style="width:${i/rounds.length*100}%"></i></div>`));
    const card = el(`<div class="card">
      <div class="qnum">${i+1} / ${rounds.length}
        <span class="pill" style="margin-left:6px">${correct}판 성공</span>
        <span class="combo">${combo>=2?' 🔥 '+combo+'연속':''}</span></div>
      <div class="qtext">이 그림이 나타내는 용접 자세의 기호는?</div>
      <div style="text-align:center">${figPos(t.k)}</div>
      <div id="chs"></div><div id="pex"></div>
    </div>`);
    v.appendChild(card);
    v.appendChild(gameBackBtn(v));

    const chs = card.querySelector('#chs');
    shuffle(POS_LIST.slice()).forEach(o=>{
      const b = el(`<button class="choice">${o.k}</button>`);
      b.onclick = ()=>{
        const ok = o.k === t.k;
        card.querySelectorAll('.choice').forEach(x=>{
          x.disabled = true;
          if(x.textContent.trim()===t.k) x.classList.add('correct');
        });
        b.classList.add('picked', ok?'correct':'wrong');
        if(ok){ correct++; combo++; } else { combo=0; wrong.push(`${t.name}(${t.k}) → ${o.k} 로 봄`); }
        try{ if(window.FX) ok ? FX.ok(b) : FX.no(b); }catch(err){ console.warn('FX',err); }
        const ex = card.querySelector('#pex');
        ex.appendChild(el(`<div class="explain"><b>${ok?'맞았습니다':'정답은 '+t.k}</b> — ${esc(t.name)}<br>
          모재가 수평이면 F 아니면 O(어느 쪽 면을 붙이는가), 수직면이면 용접선이 옆으로 가면 H, 위아래로 가면 V 입니다.</div>`));
        const nx = el(`<div class="row" style="margin-top:10px">
          <button class="btn btn-primary">${i+1>=rounds.length?'결과 보기':'다음 →'}</button></div>`);
        ex.appendChild(nx);
        nx.querySelector('button').onclick = ()=>{ i++; step(); };
      };
      chs.appendChild(b);
    });
  }
  step();
}

/* ── 게임 3 · 회로 잇기 ── */
function gameCircuit(v){
  const t0 = Date.now();
  let idx = 0, miss = 0, wrong = [];
  v.innerHTML='';
  const card = el(`<div class="card">
    <h3>⚡ 아크 용접 회로 잇기</h3>
    <div class="muted">전류가 흘러가는 차례대로 눌러 회로를 완성하세요.
      마지막에는 다시 용접기로 돌아옵니다.</div>
    <div class="slot" id="slot"><span class="muted">여기에 차례로 놓입니다</span></div>
    <div class="seq" id="pool"></div>
    <div id="cex"></div>
  </div>`);
  v.appendChild(card);
  v.appendChild(gameBackBtn(v));

  const slot = card.querySelector('#slot');
  const pool = card.querySelector('#pool');
  shuffle(CIRCUIT.slice()).forEach(name=>{
    const c = el(`<button class="chip">${esc(name)}</button>`);
    c.onclick = ()=>{
      if(c.classList.contains('used')) return;
      const want = CIRCUIT[idx];
      if(name === want){
        c.classList.add('used'); c.disabled = true;
        if(idx===0) slot.innerHTML='';
        slot.appendChild(el(`<span class="chip">${idx+1}. ${esc(name)}</span>`));
        idx++;
        try{ if(window.FX) FX.ok(c); }catch(e){ console.warn('FX',e); }
        if(idx >= CIRCUIT.length){
          slot.appendChild(el('<span class="chip">8. 용접기로 돌아옴</span>'));
          const sec = Math.round((Date.now()-t0)/1000);
          const total = CIRCUIT.length;
          const correct = Math.max(0, total - miss);
          setTimeout(()=>gameFinish(v,'회로 잇기',correct,total,sec,wrong), 500);
        }
      } else {
        miss++;
        wrong.push(`${idx+1}번째에 「${name}」 고름`);
        c.classList.add('bad');
        setTimeout(()=>c.classList.remove('bad'), 500);
        try{ if(window.FX) FX.no(c); }catch(e){ console.warn('FX',e); }
      }
    };
    pool.appendChild(c);
  });
}

/* ── 게임 4 · 용접봉 해독 ── */
function gameRod(v){
  const rounds = shuffle(RODS.slice()).slice(0,8);
  let i=0, correct=0, combo=0, wrong=[], t0=Date.now();

  function step(){
    if(i>=rounds.length) return gameFinish(v,'용접봉 해독',correct,rounds.length,
                                           Math.round((Date.now()-t0)/1000), wrong);
    const t = rounds[i];
    const ask = i % 2 === 0;   // 짝수 판은 기호→계통, 홀수 판은 계통→기호
    const others = shuffle(RODS.filter(r=>r.code!==t.code)).slice(0,3);
    const opts = shuffle([t, ...others]);
    v.innerHTML='';
    v.appendChild(el(`<div class="progress"><i style="width:${i/rounds.length*100}%"></i></div>`));
    const card = el(`<div class="card">
      <div class="qnum">${i+1} / ${rounds.length}
        <span class="pill" style="margin-left:6px">${correct}판 성공</span>
        <span class="combo">${combo>=2?' 🔥 '+combo+'연속':''}</span></div>
      <div class="qtext">${ask ? `<span style="font-size:26px;font-weight:900">${esc(t.code)}</span><br>이 용접봉의 피복제 계통은?`
                               : `<b>${esc(t.kind)}</b> 용접봉의 종류 기호는?`}</div>
      <div id="chs"></div><div id="rex"></div>
    </div>`);
    v.appendChild(card);
    v.appendChild(gameBackBtn(v));

    const chs = card.querySelector('#chs');
    const label = o => ask ? o.kind : o.code;
    opts.forEach(o=>{
      const b = el(`<button class="choice">${esc(label(o))}</button>`);
      b.onclick = ()=>{
        const ok = o.code === t.code;
        card.querySelectorAll('.choice').forEach(x=>{
          x.disabled = true;
          if(x.textContent.trim()===label(t)) x.classList.add('correct');
        });
        b.classList.add('picked', ok?'correct':'wrong');
        if(ok){ correct++; combo++; } else { combo=0; wrong.push(`${t.code} = ${t.kind} 놓침`); }
        try{ if(window.FX) ok ? FX.ok(b) : FX.no(b); }catch(err){ console.warn('FX',err); }
        const ex = card.querySelector('#rex');
        ex.appendChild(el(`<div class="explain"><b>${ok?'맞았습니다':'정답은 '+esc(label(t))}</b><br>
          ${esc(t.code)} — ${esc(t.kind)} (KS D 7004). E 는 피복 아크 용접봉, 43 은 용착 금속의 최소 인장 강도,
          뒤 두 자리가 피복제의 계통입니다.</div>`));
        const nx = el(`<div class="row" style="margin-top:10px">
          <button class="btn btn-primary">${i+1>=rounds.length?'결과 보기':'다음 →'}</button></div>`);
        ex.appendChild(nx);
        nx.querySelector('button').onclick = ()=>{ i++; step(); };
      };
      chs.appendChild(b);
    });
  }
  step();
}

/* ── 문제 풀이 ──
   연습  : 고르는 즉시 정답·해설 공개, 점수 실시간, 연출 있음
   종합  : 아무것도 알려주지 않음, 점수 감춤, 연출 없음 (규약 2)  */
/* 보기 순서도 섞습니다 — 안 섞으면 정답이 1번에 몰려 「늘 1번」이 통해 버립니다.
   섞은 뒤 정답 번호를 다시 매겨 두므로 해설·오답노트가 모두 새 번호를 따라갑니다.
   ?fix= 로 들어오면 fixorder.js 가 Math.random 을 고정하므로 반 전체가 같은 순서를 봅니다. */
function shuffleChoices(q){
  const order = shuffle(q.ch.map((_,i)=>i));
  return Object.assign({}, q, { ch: order.map(i=>q.ch[i]), a: order.indexOf(q.a) });
}

function startQuiz(v, mode){
  const n = mode==='exam' ? CFG.examN : CFG.practiceN;
  quiz = { mode, i:0, correct:0, picks:[],
           list: shuffle(QUESTIONS.slice()).slice(0, Math.min(n, QUESTIONS.length)).map(shuffleChoices),
           startTime: Date.now() };
  if(!quiz.list.length){ v.appendChild(el('<div class="empty">문항이 아직 없습니다.</div>')); return; }
  drawQ(v);
}

function drawQ(v){
  const q = quiz.list[quiz.i];
  const isExam = quiz.mode==='exam';
  v.innerHTML='';
  v.appendChild(el(`<div class="progress"><i style="width:${quiz.i/quiz.list.length*100}%"></i></div>`));
  const card = el(`<div class="card">
      <div class="qnum">${quiz.i+1} / ${quiz.list.length}
        ${isExam ? '<span class="pill" style="margin-left:6px">채점은 마지막에</span>'
                 : `<span class="pill" style="margin-left:6px">${quiz.correct}개 맞힘</span>`}</div>
      <div class="qtext">${esc(q.q)}</div>
      <div id="chs"></div>
      <div id="exp"></div>
    </div>`);
  v.appendChild(card);

  const chs = card.querySelector('#chs');
  q.ch.forEach((c,idx)=>{
    const b = el(`<button class="choice">${idx+1}. ${esc(c)}</button>`);
    b.onclick = ()=>pick(v, idx, b);
    chs.appendChild(b);
  });
}

function pick(v, idx, btn){
  const q = quiz.list[quiz.i];
  const ok = idx === q.a;
  quiz.picks.push({q, pick:idx, ok});
  if(ok) quiz.correct++;
  else   pushWrong(q, idx);

  if(quiz.mode==='exam'){                 // 종합시험 — 아무 표시 없이 다음으로
    quiz.i++;
    if(quiz.i >= quiz.list.length) return finish(v);
    return drawQ(v);
  }

  /* 연습 — 정답·해설 즉시 공개 + 연출 */
  document.querySelectorAll('.choice').forEach((b,i)=>{
    b.disabled = true;
    if(i===q.a) b.classList.add('correct');
    if(i===idx) b.classList.add('picked', ok?'correct':'wrong');
  });
  try{ if(window.FX) ok ? FX.ok(btn) : FX.no(btn); }catch(e){ console.warn('FX', e); }

  const exp = document.querySelector('#exp');
  exp.appendChild(el(`<div class="explain"><b>${ok?'맞았습니다':'정답은 '+(q.a+1)+'번'}</b><br>${esc(q.ex||'')}</div>`));
  const next = el(`<div class="row" style="margin-top:12px">
      <button class="btn btn-primary">${quiz.i+1>=quiz.list.length?'결과 보기':'다음 문제 →'}</button></div>`);
  exp.appendChild(next);
  next.querySelector('button').onclick = ()=>{
    quiz.i++;
    if(quiz.i >= quiz.list.length) return finish(v);
    drawQ(v);
  };
}

function pushWrong(q, pick){
  ST.wrong = ST.wrong.filter(w => w.q !== q.q);
  ST.wrong.unshift({ unit:q.unit||'', q:q.q, ch:q.ch, a:q.a, pick, ex:q.ex||'', at:Date.now() });
  ST.wrong = ST.wrong.slice(0, 100);
  save();
}

/* ── 끝난 뒤 ── */
function finish(v){
  const n   = quiz.list.length;
  const pct = Math.round(quiz.correct / n * 100);
  const sec = Math.round((Date.now() - quiz.startTime)/1000);
  const part = quiz.mode==='exam' ? '종합시험' : '연습';

  v.innerHTML = '';
  window.scrollTo(0,0);
  v.appendChild(el(`<div class="card" style="text-align:center">
      <div class="score">${pct}점</div>
      <div class="muted">${n}문항 중 ${quiz.correct}개 정답 · ${Math.floor(sec/60)}분 ${sec%60}초</div>
      <div id="rankBox" style="margin-top:12px"></div>
      <div id="rSubmitAnchor" style="margin-top:12px"></div>
    </div>`));

  /* 오답노트 — 종합시험은 여기서 처음으로 정답을 본다 */
  const bad = quiz.picks.filter(p=>!p.ok);
  if(bad.length){
    v.appendChild(el('<div class="card"><h3>📕 틀린 문제</h3></div>'));
    bad.forEach(p=>{
      v.appendChild(el(`<div class="card">
        <span class="pill">${esc(p.q.unit||'')}</span>
        <div class="qtext">${esc(p.q.q)}</div>
        <div class="muted">내가 고른 답 : ${p.pick+1}. ${esc(p.q.ch[p.pick])}</div>
        <div style="color:var(--ok);font-weight:700">정답 : ${p.q.a+1}. ${esc(p.q.ch[p.q.a])}</div>
        <div class="explain">${esc(p.q.ex||'')}</div>
      </div>`));
    });
  }

  /* 제출을 먼저 붙입니다 — 연출·계급에서 오류가 나도 제출 버튼은 살아 있어야 합니다. */
  mountSubmit(pct, quiz.correct, n, sec, part, bad);

  try{
    if(window.FX && pct>=60){
      FX.banner({ title: pct>=90?'훌륭합니다!':'통과!', sub:`${part} ${pct}점`,
                  stars: FX.starsFor ? FX.starsFor(pct) : 0 });
    }
  }catch(e){ console.warn('FX', e); }
  try{
    if(window.Rank){
      const res = Rank.award(pct, { mode:`용접 마스터 — ${part}` });
      $('#rankBox').innerHTML = Rank.resultBox(res);
    }
  }catch(e){ console.warn('Rank', e); }
}

/* ── 결과 제출 (규약 1) ──
   mode 는 파트마다 다르게, wrong 은 번호가 아니라 "무엇을 틀렸는지" */
function mountSubmit(pct, correct, total, sec, part, bad){
  lastResult = {
    mode   : `용접 마스터 — ${part}`,
    score  : pct, correct, total,
    /* 보기 순서를 학생마다 섞으므로 「정답 2번」은 시트에서 뜻이 없습니다.
       무엇을 골랐고 무엇이 정답인지 글로 남깁니다(규약 1 ②). */
    wrong  : (bad||[]).map(p => p.txt ? p.txt
                : `${p.q.unit||''} ${p.q.q.slice(0,22)}… : ${p.q.ch[p.pick]} → 정답 ${p.q.ch[p.q.a]}`),
    durationSec : sec,
  };
  const anchor = $('#rSubmitAnchor');
  if(!(window.ResultCollector && ResultCollector.attach) || !anchor) return;
  const btn = ResultCollector.attach(anchor, ()=>lastResult, {
    id:'rcBtn', className:'btn btn-primary',
    mode: lastResult.mode,
    extra: [`용접 마스터 ${part} ${pct}점`],
  });
  if(btn){ btn.style.width='100%'; btn.textContent = `📤 [${part}] 결과 제출`; }
}

/* ── 오답노트 (쌓인 것) ── */
function renderWrong(v){
  if(!ST.wrong.length){
    v.appendChild(el('<div class="empty">🗒️ 아직 오답이 없어요!<br>연습이나 종합시험을 풀면 여기에 모입니다.</div>'));
    return;
  }
  v.appendChild(el(`<div class="card row">
      <b>${ST.wrong.length}문항</b>
      <button class="btn" id="clrWrong">비우기</button></div>`));
  $('#clrWrong').onclick = ()=>{ ST.wrong=[]; save(); render('wrong'); };
  ST.wrong.forEach(w=>{
    v.appendChild(el(`<div class="card">
      <span class="pill">${esc(w.unit)}</span>
      <div class="qtext">${esc(w.q)}</div>
      <div class="muted">내가 고른 답 : ${w.pick+1}. ${esc(w.ch[w.pick])}</div>
      <div style="color:var(--ok);font-weight:700">정답 : ${w.a+1}. ${esc(w.ch[w.a])}</div>
      <div class="explain">${esc(w.ex)}</div>
    </div>`));
  });
}

$('#hdSub').textContent = `개념 ${LEARN.length} · 게임 4 · 문항 ${QUESTIONS.length}`;
render('learn');
</script>
